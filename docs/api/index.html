<!doctype html>
<html lang="en">
  <head>
    <title>hinge-rs API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
      }
      .version-picker {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 20;
      }
      .version-picker select {
        appearance: none;
        height: 32px;
        border: 1px solid var(--scalar-border-color, #dfdfdf);
        border-radius: var(--scalar-radius-lg, 6px);
        background: var(--scalar-background-2, #f6f6f6);
        color: var(--scalar-color-1, #1b1b1b);
        font: 400 13px/1.2 var(--scalar-font, system-ui, sans-serif);
        padding: 0 34px 0 12px;
        cursor: pointer;
      }
      .version-picker select:hover {
        background: var(--scalar-background-3, #e7e7e7);
      }
      .version-picker select:focus-visible {
        outline: 2px solid var(--scalar-color-accent, #0099ff);
        outline-offset: 2px;
      }
      .version-picker svg {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--scalar-color-2, #707070);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="version-picker">
      <select id="version-select" aria-label="API reference version"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </div>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.73.1"></script>
    <script>
      const currentVersion = "latest";
      const latestVersion = "0.2.0";
      const siteRoot = "./";
      const versionsUrl = "./versions.json";

      const select = document.getElementById('version-select');
      const addVersionOption = (label, value, selected) => {
        const option = document.createElement('option');
        option.textContent = label;
        option.value = value;
        option.selected = selected;
        select.appendChild(option);
      };

      fetch(versionsUrl)
        .then((response) => response.ok ? response.json() : { latest: latestVersion, versions: [] })
        .then((data) => {
          addVersionOption(`latest (${data.latest || latestVersion})`, siteRoot, currentVersion === 'latest');
          for (const version of data.versions || []) {
            addVersionOption(`v${version}`, `${siteRoot}v/${version}/`, currentVersion === version);
          }
          select.addEventListener('change', () => {
            window.location.href = select.value;
          });
        });

      Scalar.createApiReference('#app', {
        url: './openapi.json',
        layout: 'modern',
        theme: 'default',
        hiddenClients: true,
        expandAllResponses: true,
        persistAuth: false,
        telemetry: false,
        metaData: {
          title: 'hinge-rs API Reference',
          description: 'Unofficial typed Hinge REST and Sendbird chat API reference for Rust.'
        }
      })
    </script>
  </body>
</html>
